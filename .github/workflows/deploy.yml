# Builds on GitHub (free for public repos) and uploads the result to Cloudflare Pages, at most every 3 hours.
# Merged PRs wait for the next run; a scheduled run with no new commits since the live deploy does nothing.
name: Deploy
# The schedule is paused until the feeder pipeline's update rhythm is settled; deploy with a manual run.
on:
  # schedule:
  #   - cron: '17 */3 * * *'
  workflow_dispatch: # manual run: always deploys
concurrency: deploy
jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.live.outputs.skip }}
    steps:
      - id: live
        run: |
          live=$(curl -fsS "${{ vars.SITE_URL }}/version.txt?t=$(date +%s)" || true)
          echo "live: ${live:-none}, main: $GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$live" = "$GITHUB_SHA" ]; then echo skip=true >> "$GITHUB_OUTPUT"; fi
  deploy:
    needs: changed
    if: needs.changed.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci && npm test && npm run build
      - run: echo "$GITHUB_SHA" > dist/version.txt
      - run: npx wrangler@4 pages deploy dist --project-name=esdara --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
